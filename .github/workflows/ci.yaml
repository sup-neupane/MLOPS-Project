
name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      # AWS S3 credentials for DVC
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

      # Standard AWS credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_REGION: ap-southeast-2

      # DagsHub and MLflow credentials
      CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
      DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}

      # ECR configuration
      AWS_ACCOUNT_ID: "197821101667"
      ECR_REPOSITORY: mlops-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Run pipeline
        run: dvc repro

      - name: Run model tests
        run: python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        run: python -m unittest tests/test_flask_app.py

      - name: Login to AWS ECR
        if: success()
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login \
            --username AWS \
            --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build Docker image
        if: success()
        run: |
          docker build -t "$ECR_REPOSITORY:latest" .

      - name: Tag Docker image
        if: success()
        run: |
          docker tag "$ECR_REPOSITORY:latest" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

      - name: Push Docker image to ECR
        if: success()
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

      - name: Set Up kubectl
        if: success()
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        if: success()
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name flask-app-cluster

      - name: Create Kubernetes Secret
        if: success()
        run: |
          kubectl create secret generic capstone-secret \
            --from-literal=CAPSTONE_TEST="${CAPSTONE_TEST}" \
            --from-literal=MLFLOW_TRACKING_URI="${MLFLOW_TRACKING_URI}" \
            --from-literal=MLFLOW_TRACKING_USERNAME="${MLFLOW_TRACKING_USERNAME}" \
            --from-literal=DAGSHUB_REPO_NAME="${DAGSHUB_REPO_NAME}" \
            --from-literal=DAGSHUB_REPO_OWNER="${DAGSHUB_REPO_OWNER}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        if: success()
        run: |
          kubectl apply -f deployment.yaml
